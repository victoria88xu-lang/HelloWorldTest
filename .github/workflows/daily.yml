name: Daily AI Finance Radar Push

on:
  schedule:
    # 08:00 Singapore time (UTC+8) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  daily-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily job
        run: python daily_job.py
